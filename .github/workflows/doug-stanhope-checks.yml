name: Doug Stanhope site checks

on:
  push:
    paths:
      - "doug-stanhope-concept/**"
      - ".github/workflows/doug-stanhope-checks.yml"
  pull_request:
    paths:
      - "doug-stanhope-concept/**"
      - ".github/workflows/doug-stanhope-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doug-stanhope-concept
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doug-stanhope-concept/package-lock.json
      - name: Install test dependencies
        run: npm ci
      - name: Run unit tests
        run: node --test tests/*.test.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx playwright test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doug-stanhope-screenshots
          path: doug-stanhope-concept/test-results/screenshots
          if-no-files-found: ignore
