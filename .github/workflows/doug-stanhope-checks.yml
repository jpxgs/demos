name: Doug Stanhope site checks

on:
  push:
    paths:
      - "doug-stanhope-concept/**"
      - ".github/workflows/doug-stanhope-checks.yml"
  pull_request:
    paths:
      - "doug-stanhope-concept/**"
      - ".github/workflows/doug-stanhope-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test doug-stanhope-concept/tests/*.test.js
